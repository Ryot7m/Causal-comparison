services:
  postgres:
    image: postgres:16
    env:
      POSTGRES_DB: causal_comparison_test
      POSTGRES_USER: causal_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - 5432:5432
    options: >-
      --health-cmd "pg_isready -U causal_user -d causal_comparison_test"
      --health-interval 5s
      --health-timeout 5s
      --health-retries 5

env:
  DATABASE_URL: postgresql+psycopg://causal_user:local_dev_password@localhost:5432/causal_comparison_test