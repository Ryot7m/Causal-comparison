version: "3.9"

services:

  api:

    build: .

    ports:
      - "8080:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://causal_user:local_dev_password@db:5432/causal_comparison
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: causal_comparison
      POSTGRES_USER: causal_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: